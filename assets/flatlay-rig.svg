<?xml version="1.0" encoding="UTF-8"?>
<svg id="art" xmlns:xlink="http://www.w3.org/1999/xlink" class="dbl" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg"
     style="--leather:#20191a;--stitch:#2fbf57;--hw:#26262a;--copper:#b87333;--paint:#191413;--outline:#39d353"
     aria-label="Live preview of your custom radio strap set">
<style>
  #art .stG use{fill:none;stroke-linecap:round;stroke-dasharray:6 4.4}
  #art .stBed use{stroke:#000;stroke-opacity:.5;stroke-width:5.2}
  #art .stThread use{stroke:var(--stitch);stroke-width:2.8}
  #art .st2{display:none}
  #art.dbl .st2{display:inline}
  #art.nostitch .stG{display:none}
  #art.groove .stBed use{stroke-opacity:.34;stroke-width:4;stroke-dasharray:none}
  #art.groove .stThread use{stroke-dasharray:none;stroke-width:1.8;stroke-opacity:.5}
</style>

<defs>

  <!-- shading -->
  <linearGradient id="sheenV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"   stop-color="#fff" stop-opacity=".15"/>
    <stop offset=".16" stop-color="#fff" stop-opacity=".05"/>
    <stop offset=".55" stop-color="#000" stop-opacity=".03"/>
    <stop offset=".9"  stop-color="#000" stop-opacity=".16"/>
    <stop offset="1"   stop-color="#000" stop-opacity=".28"/>
  </linearGradient>
  <radialGradient id="domeG" cx=".34" cy=".28" r=".92">
    <stop offset="0"   stop-color="#fff" stop-opacity=".42"/>
    <stop offset=".38" stop-color="#fff" stop-opacity=".08"/>
    <stop offset=".72" stop-color="#000" stop-opacity=".10"/>
    <stop offset="1"   stop-color="#000" stop-opacity=".45"/>
  </radialGradient>
  <linearGradient id="metalG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"   stop-color="#fff" stop-opacity=".30"/>
    <stop offset=".45" stop-color="#fff" stop-opacity=".02"/>
    <stop offset="1"   stop-color="#000" stop-opacity=".38"/>
  </linearGradient>
  <!-- cylindrical shading for the pieces that wrap the radio -->
  <linearGradient id="barrelH" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0"   stop-color="#000" stop-opacity=".34"/>
    <stop offset=".14" stop-color="#000" stop-opacity=".08"/>
    <stop offset=".34" stop-color="#fff" stop-opacity=".08"/>
    <stop offset=".62" stop-color="#000" stop-opacity=".04"/>
    <stop offset=".88" stop-color="#000" stop-opacity=".18"/>
    <stop offset="1"   stop-color="#000" stop-opacity=".38"/>
  </linearGradient>
  <radialGradient id="bgG" cx=".5" cy=".42" r=".78">
    <stop offset="0" stop-color="#fbfaf7"/>
    <stop offset="1" stop-color="#e9e5dd"/>
  </radialGradient>

  <!-- leather grain -->
  <filter id="grainF" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="4" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <pattern id="grainTex" width="260" height="260" patternUnits="userSpaceOnUse">
    <rect width="260" height="260" filter="url(#grainF)"/>
  </pattern>

  <!-- flat-lay drop shadow + contact shadow -->
  <filter id="drop" x="-14%" y="-10%" width="128%" height="122%">
    <feDropShadow dx="2" dy="9" stdDeviation="11" flood-color="#3a2f24" flood-opacity=".30"/>
  </filter>
  <filter id="contact" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="4.5"/>
  </filter>

  <!-- ========================================================== LEATHER GEOMETRY — written once, painted in four passes (fill · sheen · grain · edge). Split into a back layer and a front layer so the loop tab and retention strap can cast a contact shadow onto the pieces underneath. ========================================================== -->
  <!-- body cuff: flat top and bottom edges, cylinder read comes from the shading -->
  <rect id="bodyShape" x="352" y="428" width="258" height="178" rx="14"/>
  <!-- everything that sits BEHIND the body cuff. painted as its own layer so the edge pass can't redraw hidden outlines on top of the body -->
  <g id="geoL1">
    <!-- belt strap (bleeds off both edges) -->
    <rect x="-8" y="160" width="1016" height="96"/>
    <!-- holster: belt-loop backing plate, stitched down both sides -->
    <rect x="400" y="304" width="162" height="146" rx="16"/>
    <!-- holster: bottom sling strap, hangs below and passes behind the body -->
    <rect x="398" y="560" width="154" height="152" rx="16"/>
    <!-- anti-sway strap body (runs through both end frames) -->
    <rect x="200" y="738" width="564" height="74" rx="10"/>
  </g>
  <g id="geoFront">
    <!-- holster: belt-loop strap — over the belt at the top, down the front, finished with a true half-round end centred on the snap -->
    <path d="M457 302 H505 A10 10 0 0 1 515 312 V486 A34 34 0 0 1 447 486 V312 A10 10 0 0 1 457 302 Z"/>
  </g>

  <!-- stitch runs (geometry only) — rows sit 8 in from each edge, double partners 9 further in -->
  <!-- belt -->
  <path id="q1" d="M-8 168 H1008"/><path id="q2" d="M-8 248 H1008"/>
  <path id="q3" d="M-8 177 H1008"/><path id="q4" d="M-8 239 H1008"/>
  <!-- belt-loop plate: vertical rows down both sides, clipped by the body -->
  <path id="q5" d="M408 312 V446"/><path id="q6" d="M554 312 V446"/>
  <path id="q5b" d="M417 312 V446"/><path id="q6b" d="M545 312 V446"/>
  <!-- sling strap: vertical rows down both edges, clipped by the body -->
  <path id="q11" d="M406 566 V704"/><path id="q12" d="M544 566 V704"/>
  <path id="q11b" d="M415 566 V704"/><path id="q12b" d="M535 566 V704"/>
  <!-- body cuff: rows run behind the loop strap -->
  <path id="q7"  d="M364 437 H598"/><path id="q8"  d="M364 446 H598"/>
  <path id="q9"  d="M364 597 H598"/><path id="q10" d="M364 588 H598"/>
  <!-- anti-sway -->
  <path id="q17" d="M256 746 H708"/><path id="q18" d="M256 804 H708"/>
  <path id="q19" d="M256 755 H708"/><path id="q20" d="M256 795 H708"/>

  <!-- hardware parts -->
  <!-- line-24 snap: drawn at r=10, placed with translate+scale -->
  <g id="snap">
    <circle r="10.6" fill="#000" opacity=".3"/>
    <circle r="10" fill="var(--hw)"/>
    <circle r="10" fill="url(#domeG)"/>
    <circle r="6.2" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="1.3"/>
    <circle cx="-3.2" cy="-3.6" r="2.4" fill="#fff" opacity=".22"/>
  </g>
  <!-- copper rivet -->
  <g id="rivet">
    <circle r="10.6" fill="#000" opacity=".28"/>
    <circle r="10" fill="var(--copper)"/>
    <circle r="10" fill="url(#domeG)"/>
    <circle cx="-3" cy="-3.4" r="3.1" fill="#fff" opacity=".28"/>
  </g>
  <!-- swivel trigger snap, drawn pointing left from its attach point at 0,0 -->
  <g id="hook">
    <rect x="-24" y="-13" width="26" height="26" rx="9" fill="var(--hw)"/>
    <rect x="-24" y="-13" width="26" height="26" rx="9" fill="url(#metalG)"/>
    <circle cx="-38" cy="0" r="16" fill="none" stroke="var(--hw)" stroke-width="12"/>
    <circle cx="-38" cy="0" r="16" fill="none" stroke="url(#metalG)" stroke-width="12"/>
    <circle cx="-38" cy="0" r="4.5" fill="#000" opacity=".35"/>
    <path d="M-56 -14 C-80 -48 -126 -42 -130 -4 C-133 30 -106 50 -84 37"
          fill="none" stroke="var(--hw)" stroke-width="17" stroke-linecap="round"/>
    <path d="M-56 -14 C-80 -48 -126 -42 -130 -4 C-133 30 -106 50 -84 37"
          fill="none" stroke="url(#metalG)" stroke-width="17" stroke-linecap="round"/>
    <path d="M-62 -16 C-82 -42 -116 -38 -124 -12" fill="none" stroke="#fff" stroke-opacity=".2" stroke-width="4" stroke-linecap="round"/>
    <path d="M-58 -6 L-86 34" fill="none" stroke="var(--hw)" stroke-width="9" stroke-linecap="round"/>
    <path d="M-54 2 L-34 27" fill="none" stroke="var(--hw)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="-54" cy="-3" r="6.5" fill="var(--hw)"/>
    <circle cx="-55.6" cy="-4.6" r="2" fill="#fff" opacity=".22"/>
  </g>
  <!-- square strap-end frame, drawn around 0,0 -->
  <g id="frame">
    <rect x="-31" y="-45" width="62" height="90" rx="9" fill="none" stroke="var(--hw)" stroke-width="13"/>
    <rect x="-31" y="-45" width="62" height="90" rx="9" fill="none" stroke="url(#metalG)" stroke-width="13"/>
    <path d="M-24 -39 H24" stroke="#fff" stroke-opacity=".2" stroke-width="3.4" stroke-linecap="round"/>
  </g>

  <!-- stamp artwork (drawn in a ±50 box) -->
  <g id="ph-maltese">
    <g fill="#bd2020" stroke="#e3b64f" stroke-width="5" stroke-linejoin="round" paint-order="stroke">
      <path id="mArm" d="M-12 -12 C-17 -29 -25 -42 -44 -51 C-36 -43 -31 -40 0 -38 C31 -40 36 -43 44 -51 C25 -42 17 -29 12 -12 Z"/>
      <use href="#mArm" transform="rotate(90)"/>
      <use href="#mArm" transform="rotate(180)"/>
      <use href="#mArm" transform="rotate(270)"/>
    </g>
    <circle r="16" fill="#e3b64f" stroke="#8a5a10" stroke-width="2.4"/>
    <circle r="10" fill="#bd2020"/>
    <circle r="4.2" fill="#e3b64f"/>
  </g>

  <clipPath id="roundClip"><circle r="44"/></clipPath>
  <g id="axe">
    <rect x="-5" y="-36" width="10" height="72" rx="4.5"/>
    <path d="M-4 -36 C-19 -34 -27 -25 -27 -12 L-4 -18 Z"/>
    <path d="M4 -36 C19 -34 27 -25 27 -12 L4 -18 Z"/>
  </g>
  <g id="ph-flag">
    <g clip-path="url(#roundClip)">
      <rect x="-46" y="-46" width="92" height="92" fill="#f2efe8"/>
      <g fill="#b3201f">
        <rect x="-46" y="-46" width="92" height="15"/><rect x="-46" y="-16" width="92" height="15"/>
        <rect x="-46" y="14" width="92" height="15"/><rect x="-46" y="44" width="92" height="15"/>
      </g>
      <rect x="-46" y="-46" width="46" height="44" fill="#23439c"/>
      <g fill="#f2efe8">
        <circle cx="-37" cy="-37" r="3"/><circle cx="-23" cy="-37" r="3"/><circle cx="-9" cy="-37" r="3"/>
        <circle cx="-30" cy="-26" r="3"/><circle cx="-16" cy="-26" r="3"/>
        <circle cx="-37" cy="-15" r="3"/><circle cx="-23" cy="-15" r="3"/><circle cx="-9" cy="-15" r="3"/>
      </g>
    </g>
    <g fill="#16110f" stroke="#16110f" stroke-width="2" stroke-linejoin="round" transform="scale(.82)">
      <use href="#axe" transform="rotate(27)"/>
      <use href="#axe" transform="rotate(-27)"/>
    </g>
    <circle r="44" fill="none" stroke="#16110f" stroke-width="6"/>
    <circle r="49" fill="none" stroke="#16110f" stroke-width="2.4" stroke-opacity=".55"/>
  </g>

  <g id="ph-life">
    <g fill="#1c56c4" stroke="#eef2f7" stroke-width="4" stroke-linejoin="round" paint-order="stroke">
      <rect id="lBar" x="-9" y="-46" width="18" height="92" rx="7"/>
      <use href="#lBar" transform="rotate(60)"/>
      <use href="#lBar" transform="rotate(-60)"/>
    </g>
    <rect x="-2.6" y="-27" width="5.2" height="54" rx="2.6" fill="#eef2f7"/>
    <path d="M-9 -20 C-2 -16 -9 -8 -2 -4 C-9 0 -2 8 -9 12" fill="none" stroke="#eef2f7" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g id="ph-shield">
    <path d="M0 -45 C18 -37 32 -35 36 -31 C36 6 22 32 0 46 C-22 32 -36 6 -36 -31 C-32 -35 -18 -37 0 -45 Z"
          fill="#1b2a55" stroke="#e3b64f" stroke-width="4.5" stroke-linejoin="round" paint-order="stroke"/>
    <path d="M0 -33 C13 -27 23 -26 26 -23 C26 3 16 23 0 34 C-16 23 -26 3 -26 -23 C-23 -26 -13 -27 0 -33 Z"
          fill="none" stroke="#e3b64f" stroke-width="2" stroke-opacity=".8"/>
    <polygon points="0,-18 5.3,-2.4 21.8,-2.4 8.5,7.5 13.5,23 0,13.4 -13.5,23 -8.5,7.5 -21.8,-2.4 -5.3,-2.4" fill="#e3b64f"/>
  </g>

  <g id="ph-bugle">
    <g fill="#e3b64f" stroke="#7a5410" stroke-width="2.4" stroke-linejoin="round">
      <path d="M-30 26 L-6 -22 L12 -14 L-12 34 Z"/>
      <path d="M-6 -26 C4 -40 22 -42 32 -34 C22 -30 14 -22 12 -12 Z"/>
      <rect x="-30" y="20" width="16" height="16" rx="4" transform="rotate(-24 -22 28)"/>
    </g>
  </g>
</defs>

<!-- ================= studio backdrop ================= -->
<rect width="1000" height="1000" fill="url(#bgG)"/>

<!-- ================= the rig ================= -->
<g id="rig" filter="url(#drop)">

  <!-- hardware that sits behind leather -->
  <g id="hwBack">
    <!-- holster D-ring hanging off the right of the belt-loop plate -->
    <ellipse cx="571" cy="378" rx="15" ry="18" fill="none" stroke="var(--hw)" stroke-width="8"/>
    <ellipse cx="571" cy="378" rx="15" ry="18" fill="none" stroke="url(#metalG)" stroke-width="8"/>
    <path d="M580 364 C586 370 586 386 580 392" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="2.6"/>
    <!-- holster side ring peeking out of the left seam -->
    <ellipse cx="346" cy="476" rx="12" ry="17" fill="none" stroke="var(--hw)" stroke-width="7"/>
    <ellipse cx="346" cy="476" rx="12" ry="17" fill="none" stroke="url(#metalG)" stroke-width="7"/>
    <path d="M338 464 C333 470 333 482 338 488" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="2.4"/>
    <!-- anti-sway: swivel trigger snaps -->
    <g transform="translate(196,775)"><use href="#hook"/></g>
    <g transform="translate(768,775) scale(-1,1)"><use href="#hook"/></g>
  </g>

  <!-- layer 1 leather (behind the body cuff): four passes -->
  <use href="#geoL1" fill="var(--leather)"/>
  <use href="#geoL1" fill="url(#sheenV)"/>
  <use href="#geoL1" fill="url(#grainTex)" opacity=".15" style="mix-blend-mode:overlay"/>
  <use href="#geoL1" fill="none" stroke="#000" stroke-opacity=".6" stroke-width="2.2"/>
  <rect x="398" y="560" width="154" height="152" rx="16" fill="url(#barrelH)"/>
  <g stroke="#fff" stroke-opacity=".16" stroke-width="2.6" stroke-linecap="round" fill="none">
    <path d="M-8 162.4 H1008"/>
    <path d="M214 740.5 H750"/>
    <path d="M414 307 H548"/>
  </g>
  <!-- layered-panel creases on the belt -->
  <g stroke="#000" stroke-opacity=".13" stroke-width="2" fill="none">
    <path d="M-8 196 H1008"/><path d="M-8 220 H1008"/>
  </g>

  <!-- stitching on layer 1 — runs full length, the body cuff clips it -->
  <g class="stG stBed">
    <use href="#q1"/><use href="#q2"/><use href="#q3" class="st2"/><use href="#q4" class="st2"/>
    <use href="#q5"/><use href="#q6"/><use href="#q5b" class="st2"/><use href="#q6b" class="st2"/>
    <use href="#q11"/><use href="#q12"/><use href="#q11b" class="st2"/><use href="#q12b" class="st2"/>
    <use href="#q17"/><use href="#q18"/><use href="#q19" class="st2"/><use href="#q20" class="st2"/>
  </g>
  <g class="stG stThread">
    <use href="#q1"/><use href="#q2"/><use href="#q3" class="st2"/><use href="#q4" class="st2"/>
    <use href="#q5"/><use href="#q6"/><use href="#q5b" class="st2"/><use href="#q6b" class="st2"/>
    <use href="#q11"/><use href="#q12"/><use href="#q11b" class="st2"/><use href="#q12b" class="st2"/>
    <use href="#q17"/><use href="#q18"/><use href="#q19" class="st2"/><use href="#q20" class="st2"/>
  </g>

  <!-- body cuff: four passes, then its own shading and stitching -->
  <use href="#bodyShape" fill="var(--leather)"/>
  <use href="#bodyShape" fill="url(#sheenV)"/>
  <use href="#bodyShape" fill="url(#grainTex)" opacity=".15" style="mix-blend-mode:overlay"/>
  <use href="#bodyShape" fill="none" stroke="#000" stroke-opacity=".6" stroke-width="2.2"/>
  <use href="#bodyShape" fill="url(#barrelH)"/>
  <path d="M368 430.5 H594" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="2.6" stroke-linecap="round"/>

  <g class="stG stBed">
    <use href="#q7"/><use href="#q8" class="st2"/><use href="#q9"/><use href="#q10" class="st2"/>
  </g>
  <g class="stG stThread">
    <use href="#q7"/><use href="#q8" class="st2"/><use href="#q9"/><use href="#q10" class="st2"/>
  </g>

  <!-- front leather: contact shadow, then the same four passes -->
  <use href="#geoFront" fill="#000" opacity=".42" filter="url(#contact)" transform="translate(1.5,2.5)"/>
  <use href="#geoFront" fill="var(--leather)"/>
  <use href="#geoFront" fill="url(#sheenV)"/>
  <use href="#geoFront" fill="url(#grainTex)" opacity=".15" style="mix-blend-mode:overlay"/>
  <use href="#geoFront" fill="none" stroke="#000" stroke-opacity=".6" stroke-width="2.2"/>
  <g fill="none" stroke-linecap="round">
    <!-- rolled top edge of the retention strap -->
    <path d="M452 314 C452 306 459 302 466 302" stroke="#fff" stroke-opacity=".18" stroke-width="2.6"/>
    <!-- centre sheen down the strap -->
    <path d="M459 318 V494" stroke="#fff" stroke-opacity=".07" stroke-width="8"/>
  </g>

  <!-- hardware on top -->
  <g id="hwFront">
    <!-- anti-sway: square end frames, leather folded through them -->
    <g transform="translate(227,775)"><use href="#frame"/></g>
    <g transform="translate(737,775)"><use href="#frame"/></g>
    <!-- holster: copper rivets through the belt-loop plate -->
    <g transform="translate(423,390) scale(.92)"><use href="#rivet"/></g>
    <g transform="translate(539,390) scale(.92)"><use href="#rivet"/></g>
    <!-- holster: upper snap on the retention strap -->
    <g transform="translate(481,389) scale(.72)"><use href="#snap"/></g>
    <!-- holster: body snaps -->
    <g transform="translate(424,468)"><use href="#snap"/></g>
    <g transform="translate(538,468)"><use href="#snap"/></g>
    <g transform="translate(424,571)"><use href="#snap"/></g>
    <g transform="translate(538,571)"><use href="#snap"/></g>
    <!-- holster: main retention snap -->
    <g transform="translate(481,486) scale(1.55)"><use href="#snap"/></g>
    <!-- anti-sway rivets -->
    <g transform="translate(412,775) scale(1.05)"><use href="#rivet"/></g>
    <g transform="translate(552,775) scale(1.05)"><use href="#rivet"/></g>
  </g>

  <!-- painted stamps + name -->
  <g id="stampL" transform="translate(226,208) scale(.54)"><use href="#ph-maltese"/></g>
  <g id="stampR" transform="translate(744,208) scale(.54)"><use href="#ph-flag"/></g>
  <text id="nameTxt" x="485" y="231" text-anchor="middle"
        font-family="'Bevan',serif" font-size="66" letter-spacing="7"
        fill="var(--paint)" stroke="var(--outline)" stroke-width="7" paint-order="stroke"
        stroke-linejoin="round">KILLA</text>
</g>
</svg>
